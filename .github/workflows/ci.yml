name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Vigil.Windows.slnx

      - name: Build
        run: dotnet build Vigil.Windows.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test Vigil.Windows.slnx --configuration Release --no-build
